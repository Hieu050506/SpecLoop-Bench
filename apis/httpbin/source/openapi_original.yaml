openapi: 3.0.3
info:
  contact:
    x-responsibleOrganization: Postman
  description: A simple HTTP Request & Response Service.
  title: httpbin.org
  version: ''
servers:
- url: https://httpbin.org
tags:
- description: Testing different HTTP verbs
  name: HTTP Methods
- description: Auth methods
  name: Auth
- description: Generates responses with given status code
  name: Status codes
- description: Inspect the request data
  name: Request inspection
- description: Inspect the response data like caching and headers
  name: Response inspection
- description: Returns responses in different data formats
  name: Response formats
- description: Generates random and dynamic data
  name: Dynamic data
- description: Creates, reads and deletes Cookies
  name: Cookies
- description: Returns different image formats
  name: Images
- description: Returns different redirect responses
  name: Redirects
- description: Returns anything that is passed to request
  name: Anything
paths:
  /absolute-redirect/{n}:
    get:
      responses:
        '302':
          description: A redirection.
      summary: Absolutely 302 Redirects n times.
      tags:
      - Redirects
      parameters:
      - name: n
        in: path
        required: true
        schema:
          type: int
  /anything:
    delete:
      responses:
        '200':
          description: Anything passed in request
      summary: Returns anything passed in request data.
      tags:
      - Anything
    get:
      responses:
        '200':
          description: Anything passed in request
      summary: Returns anything passed in request data.
      tags:
      - Anything
    patch:
      responses:
        '200':
          description: Anything passed in request
      summary: Returns anything passed in request data.
      tags:
      - Anything
    post:
      responses:
        '200':
          description: Anything passed in request
      summary: Returns anything passed in request data.
      tags:
      - Anything
    put:
      responses:
        '200':
          description: Anything passed in request
      summary: Returns anything passed in request data.
      tags:
      - Anything
    trace:
      responses:
        '200':
          description: Anything passed in request
      summary: Returns anything passed in request data.
      tags:
      - Anything
  /anything/{anything}:
    delete:
      responses:
        '200':
          description: Anything passed in request
      summary: Returns anything passed in request data.
      tags:
      - Anything
    get:
      responses:
        '200':
          description: Anything passed in request
      summary: Returns anything passed in request data.
      tags:
      - Anything
    patch:
      responses:
        '200':
          description: Anything passed in request
      summary: Returns anything passed in request data.
      tags:
      - Anything
    post:
      responses:
        '200':
          description: Anything passed in request
      summary: Returns anything passed in request data.
      tags:
      - Anything
    put:
      responses:
        '200':
          description: Anything passed in request
      summary: Returns anything passed in request data.
      tags:
      - Anything
    trace:
      responses:
        '200':
          description: Anything passed in request
      summary: Returns anything passed in request data.
      tags:
      - Anything
  /base64/{value}:
    get:
      responses:
        '200':
          description: Decoded base64 content.
      summary: Decodes base64url-encoded string.
      tags:
      - Dynamic data
      parameters:
      - name: value
        in: path
        required: true
        schema:
          type: string
          default: SFRUUEJJTiBpcyBhd2Vzb21l
  /basic-auth/{user}/{passwd}:
    get:
      responses:
        '200':
          description: Sucessful authentication.
        '401':
          description: Unsuccessful authentication.
      summary: Prompts the user for authorization using HTTP Basic Auth.
      tags:
      - Auth
      parameters:
      - name: user
        in: path
        required: true
        schema:
          type: string
      - name: passwd
        in: path
        required: true
        schema:
          type: string
  /bearer:
    get:
      responses:
        '200':
          description: Sucessful authentication.
        '401':
          description: Unsuccessful authentication.
      summary: Prompts the user for authorization using bearer authentication.
      tags:
      - Auth
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
  /brotli:
    get:
      responses:
        '200':
          description: Brotli-encoded data.
      summary: Returns Brotli-encoded data.
      tags:
      - Response formats
  /bytes/{n}:
    get:
      responses:
        '200':
          description: Bytes.
      summary: Returns n random bytes generated with given seed
      tags:
      - Dynamic data
      parameters:
      - name: n
        in: path
        required: true
        schema:
          type: int
  /cache:
    get:
      responses:
        '200':
          description: Cached response
        '304':
          description: Modified
      summary: Returns a 304 if an If-Modified-Since header or If-None-Match is present. Returns the same as a GET
        otherwise.
      tags:
      - Response inspection
      parameters:
      - name: If-Modified-Since
        in: header
        schema: {}
      - name: If-None-Match
        in: header
        schema: {}
  /cache/{value}:
    get:
      responses:
        '200':
          description: Cache control set
      summary: Sets a Cache-Control header for n seconds.
      tags:
      - Response inspection
      parameters:
      - name: value
        in: path
        required: true
        schema:
          type: integer
  /cookies:
    get:
      responses:
        '200':
          description: Set cookies.
      summary: Returns cookie data.
      tags:
      - Cookies
  /cookies/delete:
    get:
      responses:
        '200':
          description: Redirect to cookie list
      summary: Deletes cookie(s) as provided by the query string and redirects to cookie list.
      tags:
      - Cookies
      parameters:
      - name: freeform
        in: query
        schema:
          additionalProperties:
            type: string
          type: object
        allowEmptyValue: true
  /cookies/set:
    get:
      responses:
        '200':
          description: Redirect to cookie list
      summary: Sets cookie(s) as provided by the query string and redirects to cookie list.
      tags:
      - Cookies
      parameters:
      - name: freeform
        in: query
        schema:
          additionalProperties:
            type: string
          type: object
        allowEmptyValue: true
  /cookies/set/{name}/{value}:
    get:
      responses:
        '200':
          description: Set cookies and redirects to cookie list.
      summary: Sets a cookie and redirects to cookie list.
      tags:
      - Cookies
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: value
        in: path
        required: true
        schema:
          type: string
  /deflate:
    get:
      responses:
        '200':
          description: Defalte-encoded data.
      summary: Returns Deflate-encoded data.
      tags:
      - Response formats
  /delay/{delay}:
    delete:
      responses:
        '200':
          description: A delayed response.
      summary: Returns a delayed response (max of 10 seconds).
      tags:
      - Dynamic data
      parameters:
      - name: delay
        in: path
        required: true
        schema:
          type: int
    get:
      responses:
        '200':
          description: A delayed response.
      summary: Returns a delayed response (max of 10 seconds).
      tags:
      - Dynamic data
      parameters:
      - name: delay
        in: path
        required: true
        schema:
          type: int
    patch:
      responses:
        '200':
          description: A delayed response.
      summary: Returns a delayed response (max of 10 seconds).
      tags:
      - Dynamic data
      parameters:
      - name: delay
        in: path
        required: true
        schema:
          type: int
    post:
      responses:
        '200':
          description: A delayed response.
      summary: Returns a delayed response (max of 10 seconds).
      tags:
      - Dynamic data
      parameters:
      - name: delay
        in: path
        required: true
        schema:
          type: int
    put:
      responses:
        '200':
          description: A delayed response.
      summary: Returns a delayed response (max of 10 seconds).
      tags:
      - Dynamic data
      parameters:
      - name: delay
        in: path
        required: true
        schema:
          type: int
    trace:
      responses:
        '200':
          description: A delayed response.
      summary: Returns a delayed response (max of 10 seconds).
      tags:
      - Dynamic data
      parameters:
      - name: delay
        in: path
        required: true
        schema:
          type: int
  /delete:
    delete:
      responses:
        '200':
          description: The request's DELETE parameters.
      summary: The request's DELETE parameters.
      tags:
      - HTTP Methods
  /deny:
    get:
      responses:
        '200':
          description: Denied message
      summary: Returns page denied by robots.txt rules.
      tags:
      - Response formats
  /digest-auth/{qop}/{user}/{passwd}:
    get:
      responses:
        '200':
          description: Sucessful authentication.
        '401':
          description: Unsuccessful authentication.
      summary: Prompts the user for authorization using Digest Auth.
      tags:
      - Auth
      parameters:
      - name: qop
        in: path
        description: auth or auth-int
        required: true
        schema:
          type: string
      - name: user
        in: path
        required: true
        schema:
          type: string
      - name: passwd
        in: path
        required: true
        schema:
          type: string
  /digest-auth/{qop}/{user}/{passwd}/{algorithm}:
    get:
      responses:
        '200':
          description: Sucessful authentication.
        '401':
          description: Unsuccessful authentication.
      summary: Prompts the user for authorization using Digest Auth + Algorithm.
      tags:
      - Auth
      parameters:
      - name: qop
        in: path
        description: auth or auth-int
        required: true
        schema:
          type: string
      - name: user
        in: path
        required: true
        schema:
          type: string
      - name: passwd
        in: path
        required: true
        schema:
          type: string
      - name: algorithm
        in: path
        description: MD5, SHA-256, SHA-512
        required: true
        schema:
          type: string
          default: MD5
  /digest-auth/{qop}/{user}/{passwd}/{algorithm}/{stale_after}:
    get:
      description: |
        allow settings the stale_after argument.
      responses:
        '200':
          description: Sucessful authentication.
        '401':
          description: Unsuccessful authentication.
      summary: Prompts the user for authorization using Digest Auth + Algorithm.
      tags:
      - Auth
      parameters:
      - name: qop
        in: path
        description: auth or auth-int
        required: true
        schema:
          type: string
      - name: user
        in: path
        required: true
        schema:
          type: string
      - name: passwd
        in: path
        required: true
        schema:
          type: string
      - name: algorithm
        in: path
        description: MD5, SHA-256, SHA-512
        required: true
        schema:
          type: string
          default: MD5
      - name: stale_after
        in: path
        required: true
        schema:
          type: string
          default: never
  /drip:
    get:
      responses:
        '200':
          description: A dripped response.
      summary: Drips data over a duration after an optional initial delay.
      tags:
      - Dynamic data
      parameters:
      - name: duration
        in: query
        description: The amount of time (in seconds) over which to drip each byte
        required: false
        schema:
          type: number
          default: 2
      - name: numbytes
        in: query
        description: The number of bytes to respond with
        required: false
        schema:
          type: integer
          default: 10
      - name: code
        in: query
        description: The response code that will be returned
        required: false
        schema:
          type: integer
          default: 200
      - name: delay
        in: query
        description: The amount of time (in seconds) to delay before responding
        required: false
        schema:
          type: number
          default: 2
  /encoding/utf8:
    get:
      responses:
        '200':
          description: Encoded UTF-8 content.
      summary: Returns a UTF-8 encoded body.
      tags:
      - Response formats
  /etag/{etag}:
    get:
      responses:
        '200':
          description: Normal response
        '412':
          description: match
      summary: Assumes the resource has the given etag and responds to If-None-Match and If-Match headers appropriately.
      tags:
      - Response inspection
      parameters:
      - name: If-None-Match
        in: header
        schema: {}
      - name: If-Match
        in: header
        schema: {}
  /get:
    get:
      responses:
        '200':
          description: The request's query parameters.
      summary: The request's query parameters.
      tags:
      - HTTP Methods
  /gzip:
    get:
      responses:
        '200':
          description: GZip-encoded data.
      summary: Returns GZip-encoded data.
      tags:
      - Response formats
  /headers:
    get:
      responses:
        '200':
          description: The request's headers.
      summary: Return the incoming request's HTTP headers.
      tags:
      - Request inspection
  /hidden-basic-auth/{user}/{passwd}:
    get:
      responses:
        '200':
          description: Sucessful authentication.
        '404':
          description: Unsuccessful authentication.
      summary: Prompts the user for authorization using HTTP Basic Auth.
      tags:
      - Auth
      parameters:
      - name: user
        in: path
        required: true
        schema:
          type: string
      - name: passwd
        in: path
        required: true
        schema:
          type: string
  /html:
    get:
      responses:
        '200':
          description: An HTML page.
      summary: Returns a simple HTML document.
      tags:
      - Response formats
  /image:
    get:
      responses:
        '200':
          description: An image.
      summary: Returns a simple image of the type suggest by the Accept header.
      tags:
      - Images
  /image/jpeg:
    get:
      responses:
        '200':
          description: A JPEG image.
      summary: Returns a simple JPEG image.
      tags:
      - Images
  /image/png:
    get:
      responses:
        '200':
          description: A PNG image.
      summary: Returns a simple PNG image.
      tags:
      - Images
  /image/svg:
    get:
      responses:
        '200':
          description: An SVG image.
      summary: Returns a simple SVG image.
      tags:
      - Images
  /image/webp:
    get:
      responses:
        '200':
          description: A WEBP image.
      summary: Returns a simple WEBP image.
      tags:
      - Images
  /ip:
    get:
      responses:
        '200':
          description: The Requester's IP Address.
      summary: Returns the requester's IP Address.
      tags:
      - Request inspection
  /json:
    get:
      responses:
        '200':
          description: An JSON document.
      summary: Returns a simple JSON document.
      tags:
      - Response formats
  /links/{n}/{offset}:
    get:
      responses:
        '200':
          description: HTML links.
      summary: Generate a page containing n links to other pages which do the same.
      tags:
      - Dynamic data
      parameters:
      - name: n
        in: path
        required: true
        schema:
          type: int
      - name: offset
        in: path
        required: true
        schema:
          type: int
  /patch:
    patch:
      responses:
        '200':
          description: The request's PATCH parameters.
      summary: The request's PATCH parameters.
      tags:
      - HTTP Methods
  /post:
    post:
      responses:
        '200':
          description: The request's POST parameters.
      summary: The request's POST parameters.
      tags:
      - HTTP Methods
  /put:
    put:
      responses:
        '200':
          description: The request's PUT parameters.
      summary: The request's PUT parameters.
      tags:
      - HTTP Methods
  /range/{numbytes}:
    get:
      responses:
        '200':
          description: Bytes.
      summary: Streams n random bytes generated with given seed, at given chunk size per packet.
      tags:
      - Dynamic data
      parameters:
      - name: numbytes
        in: path
        required: true
        schema:
          type: int
  /redirect-to:
    delete:
      responses:
        '302':
          description: A redirection.
      summary: 302/3XX Redirects to the given URL.
      tags:
      - Redirects
    get:
      responses:
        '302':
          description: A redirection.
      summary: 302/3XX Redirects to the given URL.
      tags:
      - Redirects
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
      - name: status_code
        in: query
        schema:
          type: int
    patch:
      responses:
        '302':
          description: A redirection.
      summary: 302/3XX Redirects to the given URL.
      tags:
      - Redirects
    post:
      responses:
        '302':
          description: A redirection.
      summary: 302/3XX Redirects to the given URL.
      tags:
      - Redirects
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                url:
                  type: string
                status_code:
                  type: int
              required:
              - url
    put:
      responses:
        '302':
          description: A redirection.
      summary: 302/3XX Redirects to the given URL.
      tags:
      - Redirects
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                url:
                  type: string
                status_code:
                  type: int
              required:
              - url
    trace:
      responses:
        '302':
          description: A redirection.
      summary: 302/3XX Redirects to the given URL.
      tags:
      - Redirects
  /redirect/{n}:
    get:
      responses:
        '302':
          description: A redirection.
      summary: 302 Redirects n times.
      tags:
      - Redirects
      parameters:
      - name: n
        in: path
        required: true
        schema:
          type: int
  /relative-redirect/{n}:
    get:
      responses:
        '302':
          description: A redirection.
      summary: Relatively 302 Redirects n times.
      tags:
      - Redirects
      parameters:
      - name: n
        in: path
        required: true
        schema:
          type: int
  /response-headers:
    get:
      responses:
        '200':
          description: Response headers
      summary: Returns a set of response headers from the query string.
      tags:
      - Response inspection
      parameters:
      - name: freeform
        in: query
        schema:
          additionalProperties:
            type: string
          type: object
        allowEmptyValue: true
    post:
      responses:
        '200':
          description: Response headers
      summary: Returns a set of response headers from the query string.
      tags:
      - Response inspection
      parameters:
      - name: freeform
        in: query
        schema:
          additionalProperties:
            type: string
          type: object
        allowEmptyValue: true
  /robots.txt:
    get:
      responses:
        '200':
          description: Robots file
      summary: Returns some robots.txt rules.
      tags:
      - Response formats
  /status/{codes}:
    delete:
      responses:
        '100':
          description: Informational responses
        '200':
          description: Success
        '300':
          description: Redirection
        '400':
          description: Client Errors
        '500':
          description: Server Errors
      summary: Return status code or random status code if more than one are given
      tags:
      - Status codes
      parameters:
      - name: codes
        in: path
        required: true
        schema: {}
    get:
      responses:
        '100':
          description: Informational responses
        '200':
          description: Success
        '300':
          description: Redirection
        '400':
          description: Client Errors
        '500':
          description: Server Errors
      summary: Return status code or random status code if more than one are given
      tags:
      - Status codes
      parameters:
      - name: codes
        in: path
        required: true
        schema: {}
    patch:
      responses:
        '100':
          description: Informational responses
        '200':
          description: Success
        '300':
          description: Redirection
        '400':
          description: Client Errors
        '500':
          description: Server Errors
      summary: Return status code or random status code if more than one are given
      tags:
      - Status codes
      parameters:
      - name: codes
        in: path
        required: true
        schema: {}
    post:
      responses:
        '100':
          description: Informational responses
        '200':
          description: Success
        '300':
          description: Redirection
        '400':
          description: Client Errors
        '500':
          description: Server Errors
      summary: Return status code or random status code if more than one are given
      tags:
      - Status codes
      parameters:
      - name: codes
        in: path
        required: true
        schema: {}
    put:
      responses:
        '100':
          description: Informational responses
        '200':
          description: Success
        '300':
          description: Redirection
        '400':
          description: Client Errors
        '500':
          description: Server Errors
      summary: Return status code or random status code if more than one are given
      tags:
      - Status codes
      parameters:
      - name: codes
        in: path
        required: true
        schema: {}
    trace:
      responses:
        '100':
          description: Informational responses
        '200':
          description: Success
        '300':
          description: Redirection
        '400':
          description: Client Errors
        '500':
          description: Server Errors
      summary: Return status code or random status code if more than one are given
      tags:
      - Status codes
      parameters:
      - name: codes
        in: path
        required: true
        schema: {}
  /stream-bytes/{n}:
    get:
      responses:
        '200':
          description: Bytes.
      summary: Streams n random bytes generated with given seed, at given chunk size per packet.
      tags:
      - Dynamic data
      parameters:
      - name: n
        in: path
        required: true
        schema:
          type: int
  /stream/{n}:
    get:
      responses:
        '200':
          description: Streamed JSON responses.
      summary: Stream n JSON responses
      tags:
      - Dynamic data
      parameters:
      - name: n
        in: path
        required: true
        schema:
          type: int
  /user-agent:
    get:
      responses:
        '200':
          description: The request's User-Agent header.
      summary: Return the incoming requests's User-Agent header.
      tags:
      - Request inspection
  /uuid:
    get:
      responses:
        '200':
          description: A UUID4.
      summary: Return a UUID4.
      tags:
      - Dynamic data
  /xml:
    get:
      responses:
        '200':
          description: An XML document.
      summary: Returns a simple XML document.
      tags:
      - Response formats
