id: spring-petclinic
name: Spring PetClinic REST API
group: A
description: 'API quản lý phòng khám thú y (chủ nuôi, thú cưng, bác sĩ, lượt khám,
  chuyên khoa, loài): 37 operation CRUD đầy đủ. Ràng buộc: required, minLength/maxLength,
  pattern (số điện thoại), định dạng ngày; đặc tả OpenAPI do dự án công bố cùng mã
  nguồn.'
source:
  spec_url: https://raw.githubusercontent.com/spring-petclinic/spring-petclinic-rest/master/src/main/resources/openapi.yml
  spec_file: source/openapi_original.yml
  license: Apache-2.0 (dự án Spring PetClinic)
  homepage: https://github.com/spring-petclinic/spring-petclinic-rest
  docs_url: https://github.com/spring-petclinic/spring-petclinic-rest#readme
  retrieved_at: '2026-11-01'
  normalization:
  - đổi nhãn phiên bản 3.0.1 -> 3.0.3 (tương thích ngữ nghĩa)
  - chuyển mã phản hồi dạng số sang chuỗi ở 37 operation
  - 'pattern: lớp Unicode \p{L}/\p{N} -> khoảng ký tự tương đương (ECMA 262)'
environment:
  type: local-docker
  base_url: http://localhost:9966/petclinic/api
  test_scope: full
  auth:
    type: none
  rate_limit_rps: 5
  connectivity_checked: true
  probe:
    method: GET
    path: /vets
    params: {}
docs:
  original: null
  rendered: docs/rendered.md
  ablated: docs/ablated.md
  make_ablated: true
ground_truth:
  doc: ground_truth/openapi.yaml
  behavior: null
  behavior_status: pending
  verified_by: []
  notes: GT tài liệu = đặc tả chính thức; GT hành vi chưa xác minh.
rq_scope:
- RQ1
- RQ2
- RQ3
added_by: nhóm đề tài (đợt mở rộng lên 20 API, 11/2026)
notes: 'Docker: springcommunity/spring-petclinic-rest (cổng 9966, đường dẫn gốc /petclinic/api).
  Dữ liệu mẫu trong H2 in-memory – khởi động lại container là về mặc định (dùng làm
  reset).'
