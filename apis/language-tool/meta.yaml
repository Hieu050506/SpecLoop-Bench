id: language-tool
name: LanguageTool HTTP API
group: B
description: 'API kiểm tra chính tả/ngữ pháp LanguageTool: 2 operation, tham số gửi
  dạng form trong body. Có thể dùng bản công khai (giới hạn tốc độ) hoặc tự triển
  khai bằng Docker.'
source:
  spec_url: https://github.com/codingsoo/nlp2rest/blob/ae3783b7/specifications/openapi/language-tool.yaml
  spec_file: source/openapi_original.yaml
  license: Đặc tả công khai của nhà cung cấp, lấy từ kho NLP2REST (ISSTA 2023) – chỉ
    dùng cho nghiên cứu
  homepage: https://github.com/codingsoo/nlp2rest
  docs_url: https://languagetool.org/http-api/
  retrieved_at: '2026-10-27'
  normalization:
  - đổi nhãn phiên bản 3.0.1 -> 3.0.3 (tương thích ngữ nghĩa)
  - chuyển mã phản hồi dạng số sang chuỗi ở 2 operation
  - 'servers[0].url: ''http://localhost:9003/v2'' -> ''https://api.languagetool.org/v2'''
environment:
  type: public
  base_url: https://api.languagetool.org/v2
  test_scope: read-only
  auth:
    type: none
  rate_limit_rps: 1
  connectivity_checked: false
  probe:
    method: GET
    path: /languages
    params: {}
docs:
  original: null
  rendered: docs/rendered.md
  ablated: null
  make_ablated: false
ground_truth:
  doc: ground_truth/openapi.yaml
  behavior: null
  behavior_status: pending
  verified_by: []
  notes: GT tài liệu = đặc tả chính thức; GT hành vi chưa xác minh.
rq_scope:
- RQ1
- RQ2
- RQ3
added_by: nhóm đề tài (nhập ban đầu)
notes: Bản công khai giới hạn số request mỗi phút; khi chạy thực nghiệm nhiều nên
  tự triển khai LanguageTool server.
