id: omdb
name: OMDb API
group: B
description: 'API tra cứu phim OMDb: 1 operation với 9 tham số và phụ thuộc giữa tham
  số (i hoặc t hoặc s). Cần khóa API miễn phí.'
source:
  spec_url: https://github.com/codingsoo/nlp2rest/blob/ae3783b7/specifications/openapi/omdb.yaml
  spec_file: source/openapi_original.yaml
  license: Đặc tả công khai của nhà cung cấp, lấy từ kho NLP2REST (ISSTA 2023) – chỉ
    dùng cho nghiên cứu
  homepage: https://github.com/codingsoo/nlp2rest
  docs_url: https://www.omdbapi.com/
  retrieved_at: '2026-10-27'
  normalization:
  - đổi nhãn phiên bản 3.0.1 -> 3.0.3 (tương thích ngữ nghĩa)
  - 'servers[0].url: ''http://localhost:9006/'' -> ''https://www.omdbapi.com'''
environment:
  type: public
  base_url: https://www.omdbapi.com
  test_scope: read-only
  auth:
    type: apiKey
    in: query
    name: apikey
    env_var: OMDB_API_KEY
  rate_limit_rps: 1
  connectivity_checked: false
  probe:
    method: GET
    path: /
    params:
      t: Inception
docs:
  original: null
  rendered: docs/rendered.md
  ablated: null
  make_ablated: false
ground_truth:
  doc: ground_truth/openapi.yaml
  behavior: null
  behavior_status: pending
  verified_by: []
  notes: GT tài liệu = đặc tả chính thức; GT hành vi chưa xác minh.
rq_scope:
- RQ1
- RQ2
- RQ3
added_by: nhóm đề tài (nhập ban đầu)
notes: Đăng ký khóa miễn phí tại omdbapi.com (giới hạn 1.000 request/ngày).
