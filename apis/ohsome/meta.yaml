id: ohsome
name: ohsome API
group: B
description: 'API thống kê dữ liệu OpenStreetMap (ohsome): 122 operation, rất nhiều
  tham số dùng chung và phụ thuộc giữa tham số (bboxes/bcircles/bpolys). Dùng làm
  API cỡ lớn để thử khả năng mở rộng.'
source:
  spec_url: https://github.com/codingsoo/nlp2rest/blob/ae3783b7/specifications/openapi/ohsome.yaml
  spec_file: source/openapi_original.yaml
  license: Đặc tả công khai của nhà cung cấp, lấy từ kho NLP2REST (ISSTA 2023) – chỉ
    dùng cho nghiên cứu
  homepage: https://github.com/codingsoo/nlp2rest
  docs_url: https://docs.ohsome.org/ohsome-api/v1/
  retrieved_at: '2026-10-27'
  normalization:
  - đổi nhãn phiên bản 3.0.1 -> 3.0.3 (tương thích ngữ nghĩa)
  - 'servers[0].url: ''http://localhost:9005/v1'' -> ''https://api.ohsome.org/v1'''
environment:
  type: public
  base_url: https://api.ohsome.org/v1
  test_scope: read-only
  auth:
    type: none
  rate_limit_rps: 1
  connectivity_checked: false
  probe:
    method: GET
    path: /metadata
    params: {}
docs:
  original: null
  rendered: docs/rendered.md
  ablated: null
  make_ablated: false
ground_truth:
  doc: ground_truth/openapi.yaml
  behavior: null
  behavior_status: pending
  verified_by: []
  notes: GT tài liệu = đặc tả chính thức; GT hành vi chưa xác minh.
rq_scope:
- RQ1
- RQ2
- RQ3
added_by: nhóm đề tài (nhập ban đầu)
notes: Tài liệu render rất dài (~73 nghìn từ) – hệ thống bắt buộc phải phân đoạn;
  có thể chọn tập con operation cho thực nghiệm chính.
