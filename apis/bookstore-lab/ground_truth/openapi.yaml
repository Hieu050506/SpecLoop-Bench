openapi: 3.0.3
info:
  title: Bookstore-Lab API
  version: 1.0.0
  description: Lab REST API of a small online bookstore – browse books and authors, add books and place orders.
  x-dataset-note: >-
    Ground truth THEO TÀI LIỆU (doc-GT) của Bookstore-Lab – mô tả đúng những gì docs/original.md viết.
    Hành vi thực tế nằm ở behavior_openapi.yaml; khác biệt liệt kê trong discrepancies.json.
servers:
  - url: http://localhost:8000/v1
tags:
  - name: Books
  - name: Authors
  - name: Orders
paths:
  /books:
    get:
      tags: [Books]
      operationId: listBooks
      summary: List books
      parameters:
        - name: limit
          in: query
          description: Number of books per page.
          schema: {type: integer, default: 20}
        - name: page
          in: query
          description: Page number, starting from 1.
          schema: {type: integer, minimum: 1, default: 1}
        - name: sort
          in: query
          required: true
          description: Sort field.
          schema: {type: string, enum: [title, published_at]}
        - name: order
          in: query
          description: Sort direction. Only used together with sort.
          schema: {type: string, enum: [asc, desc]}
      x-dependencies:
        - IF order THEN sort;
      responses:
        '200':
          description: A page of books.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookPage'}
        '400':
          description: Invalid query parameter.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      tags: [Books]
      operationId: createBook
      summary: Create a book
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookCreate'}
      responses:
        '201':
          description: The created book.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '400':
          description: Validation error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /books/{book_id}:
    get:
      tags: [Books]
      operationId: getBook
      summary: Get a book
      parameters:
        - name: book_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: The book.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
  /authors:
    get:
      tags: [Authors]
      operationId: listAuthors
      summary: List authors
      parameters:
        - name: q
          in: query
          description: Search text matched against author names. At least 2 characters.
          schema: {type: string, minLength: 2}
        - name: page
          in: query
          description: Page number, starting from 1.
          schema: {type: integer, minimum: 1, default: 1}
      responses:
        '200':
          description: A page of authors (10 per page).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorPage'}
        '400':
          description: Invalid query parameter.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /authors/{author_id}:
    get:
      tags: [Authors]
      operationId: getAuthor
      summary: Get an author
      parameters:
        - name: author_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: The author.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Author'}
        '404':
          description: Author not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCreate'}
      responses:
        '200':
          description: The created order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400':
          description: Validation error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /orders/{order_id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '404':
          description: Order not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '204':
          description: Order cancelled.
        '404':
          description: Order not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  schemas:
    Book:
      type: object
      required: [id, title, isbn, price, genre, author_id]
      properties:
        id: {type: integer}
        title: {type: string}
        isbn: {type: string, pattern: '^[0-9]{13}$'}
        price: {type: number}
        genre: {type: string, enum: [fiction, science, history]}
        published_at: {type: string, format: date}
        tags:
          type: array
          items: {type: string}
        author_id: {type: integer}
    BookPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Book'}
        total: {type: integer}
    BookCreate:
      type: object
      required: [title, isbn, price, genre, author_id]
      properties:
        title: {type: string}
        isbn: {type: string, pattern: '^[0-9]{13}$'}
        price: {type: number, minimum: 0, exclusiveMinimum: true}
        genre: {type: string, enum: [fiction, science, history]}
        published_at: {type: string, format: date}
        tags:
          type: array
          items: {type: string}
        author_id: {type: integer}
    Author:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}
        country: {type: string}
    AuthorPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Author'}
        total: {type: integer}
    OrderCreate:
      type: object
      required: [book_id, quantity]
      properties:
        book_id: {type: integer}
        quantity: {type: integer, minimum: 1, maximum: 10}
        coupon_code: {type: string}
        voucher_type: {type: string, enum: [percent, fixed]}
    Order:
      type: object
      required: [id, book_id, quantity, total_price, status]
      properties:
        id: {type: integer}
        book_id: {type: integer}
        quantity: {type: integer}
        total_price: {type: number}
        status: {type: string, enum: [pending, paid, cancelled]}
        coupon_code: {type: string, nullable: true}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        field: {type: string, nullable: true}
