id: genome-nexus
name: Genome Nexus API
group: B
description: 'API chú giải biến thể gen (Genome Nexus): 23 operation, nhiều tham số
  path dạng định danh khoa học, schema phản hồi lớn. Không cần khóa.'
source:
  spec_url: https://github.com/codingsoo/nlp2rest/blob/ae3783b7/specifications/openapi/genome-nexus.yaml
  spec_file: source/openapi_original.yaml
  license: Đặc tả công khai của nhà cung cấp, lấy từ kho NLP2REST (ISSTA 2023) – chỉ
    dùng cho nghiên cứu
  homepage: https://github.com/codingsoo/nlp2rest
  docs_url: https://www.genomenexus.org/api
  retrieved_at: '2026-10-27'
  normalization:
  - đổi nhãn phiên bản 3.0.1 -> 3.0.3 (tương thích ngữ nghĩa)
  - chuyển mã phản hồi dạng số sang chuỗi ở 23 operation
  - 'servers[0].url: ''http://localhost:9002/'' -> ''https://www.genomenexus.org'''
environment:
  type: public
  base_url: https://www.genomenexus.org
  test_scope: read-only
  auth:
    type: none
  rate_limit_rps: 1
  connectivity_checked: false
  probe:
    method: GET
    path: /version
    params: {}
docs:
  original: null
  rendered: docs/rendered.md
  ablated: null
  make_ablated: false
ground_truth:
  doc: ground_truth/openapi.yaml
  behavior: null
  behavior_status: pending
  verified_by: []
  notes: GT tài liệu = đặc tả chính thức; GT hành vi chưa xác minh.
rq_scope:
- RQ1
- RQ2
- RQ3
added_by: nhóm đề tài (nhập ban đầu)
notes: Nhiều operation POST chỉ đọc dữ liệu (tra cứu hàng loạt) – vẫn an toàn khi
  kiểm thử với tốc độ thấp.
